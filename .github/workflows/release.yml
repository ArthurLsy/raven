name: Release

on:
  push:
    tags:
      - '[0-9]*.*.*'
  workflow_dispatch:

jobs:
  build-macos-silicon:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      - name: Build
        run: bun run tauri build --bundles app

      - name: Archive .app
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf Raven-macos-silicon.tar.gz "Raven.app"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "Raven ${{ github.ref_name }}"
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation macOS

            > **"Raven est endommagé"** — l'app n'est pas encore signée. Après avoir glissé Raven.app dans `/Applications`, ouvre un Terminal et exécute :
            > ```
            > xattr -cr /Applications/Raven.app
            > ```
            > Puis relance l'app normalement.
          files: src-tauri/target/release/bundle/macos/Raven-macos-silicon.tar.gz

  bump-homebrew-formula:
    needs: [build-macos-silicon]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: arthurlsy/homebrew-gowey
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Compute SHA256
        id: sha
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Raven-macos-silicon.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Update cask
        run: |
          sed -i "s|version \".*\"|version \"${{ github.ref_name }}\"|" tap/Casks/raven.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha.outputs.sha256 }}\"|" tap/Casks/raven.rb

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/raven.rb
          git commit -m "raven ${{ github.ref_name }}"
          git push
