name: Release

on:
  push:
    tags:
      - '[0-9]*.*.*'
  workflow_dispatch:

jobs:
  build-macos-silicon:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      - name: Build
        run: bun run tauri build --bundles app

      - name: Archive .app
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf Raven-macos-silicon.tar.gz "Raven.app"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "Raven ${{ github.ref_name }}"
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation macOS

            > **"Raven est endommagé"** — l'app n'est pas encore signée. Après avoir glissé Raven.app dans `/Applications`, ouvre un Terminal et exécute :
            > ```
            > xattr -cr /Applications/Raven.app
            > ```
            > Puis relance l'app normalement.
          files: src-tauri/target/release/bundle/macos/Raven-macos-silicon.tar.gz

  bump-homebrew-cask:
    needs: [build-macos-silicon]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: macauley/action-homebrew-bump-cask@v1.0.0
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: arthurlsy/homebrew-gowey
          cask: raven
          tag: ${{ github.ref_name }}
          url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Raven-macos-silicon.tar.gz
