name: Release

on:
  push:
    tags:
      - 'ALPHA-*'
  workflow_dispatch:

jobs:
  build-macos-silicon:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      - name: Build
        run: bun run tauri build --bundles app,dmg

      - name: Zip .app
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r Raven-macos-silicon.zip "Raven.app"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "Raven ${{ github.ref_name }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ## Installation macOS

            > **"Raven est endommagé"** — l'app n'est pas encore signée. Après avoir glissé Raven.app dans `/Applications`, ouvre un Terminal et exécute :
            > ```
            > xattr -cr /Applications/Raven.app
            > ```
            > Puis relance l'app normalement.
          files: |
            src-tauri/target/release/bundle/macos/Raven-macos-silicon.zip
            src-tauri/target/release/bundle/dmg/*.dmg

  build-macos-intel:
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      - name: Build
        run: bun run tauri build --bundles app,dmg

      - name: Zip .app
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r Raven-macos-intel.zip "Raven.app"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "Raven ${{ github.ref_name }}"
          prerelease: true
          files: |
            src-tauri/target/release/bundle/macos/Raven-macos-intel.zip
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      - name: Build
        run: bun run tauri build --bundles nsis,msi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "Raven ${{ github.ref_name }}"
          prerelease: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
